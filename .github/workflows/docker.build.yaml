name: Build Composer 2 Docker images
on:
  workflow_dispatch:
  repository_dispatch:
    types: [php-images-built]
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*.*.*'

env:
  PHP_IMAGE: harbor.flownative.io/docker/php

jobs:
  # The images are always built from the latest release.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 100

      - name: Determine latest released version
        id: latest_version
        uses: flownative/action-git-latest-release@v1

  # Every platform is built natively on a runner of its own instead of
  # emulating arm64 with QEMU. The images are pushed by digest only and
  # tagged in the merge job.
  build:
    needs: prepare
    strategy:
      matrix:
        php: [ "8.2", "8.3", "8.4", "8.5" ]
        user: [ "composer", "root" ]
        platform: [ linux/amd64, linux/arm64 ]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      # The digest artifact is named after the PHP version found here. Should
      # docker-php publish a new version between the jobs of the two
      # platforms, the merge job finds only one digest per version and fails
      # instead of combining images of different PHP versions.
      - name: Determine latest built PHP ${{ matrix.php }} version
        id: php
        env:
          PHP_BRANCH: ${{ matrix.php }}
          USER_NAME: ${{ matrix.user }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(docker buildx imagetools inspect "${PHP_IMAGE}:${PHP_BRANCH}" \
            --format '{{ index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.version" }}')"
          if ! [[ "${version}" =~ ^${PHP_BRANCH//./\\.}\.[0-9]+$ ]]; then
            echo "::error::${PHP_IMAGE}:${PHP_BRANCH} has an unexpected version label: '${version}'"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact=digest-${version}-${USER_NAME}-${PLATFORM#linux/}" >> "${GITHUB_OUTPUT}"

      - name: Determine image names
        id: names
        env:
          USER_NAME: ${{ matrix.user }}
        run: |
          if [ "${USER_NAME}" = "root" ]; then
            echo "docker_hub=flownative/composer2-root" >> "${GITHUB_OUTPUT}"
            echo "harbor=harbor.flownative.io/docker/composer2-root" >> "${GITHUB_OUTPUT}"
          else
            echo "docker_hub=flownative/composer2" >> "${GITHUB_OUTPUT}"
            echo "harbor=harbor.flownative.io/docker/composer2" >> "${GITHUB_OUTPUT}"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.names.outputs.docker_hub }}
            ${{ steps.names.outputs.harbor }}
          labels: |
            org.opencontainers.image.title=Composer
            org.opencontainers.image.description=Docker image providing Composer 2 for Beach and Local Beach
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Flownative GmbH
            org.opencontainers.image.authors=Robert Lemke <robert@flownative.com>
            org.opencontainers.image.version=${{ steps.php.outputs.version }}

      - name: Add USER statement
        env:
          USER_NAME: ${{ matrix.user }}
        run: |
          echo "USER ${USER_NAME}" >> Dockerfile

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            PHP_BASE_IMAGE=${{ env.PHP_IMAGE }}:${{ steps.php.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.names.outputs.docker_hub }},${{ steps.names.outputs.harbor }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.php.outputs.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the images of all platforms into one manifest list per PHP
  # version and user and tags it in both registries. The PHP versions and
  # users are taken from the names of the digest artifacts, so they are
  # listed only once above.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_IO_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_IO_REGISTRY_PASSWORD }}

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: harbor.flownative.io
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}

      # Each registry gets its manifest list from the images pushed to that
      # same registry, so no blobs have to be copied between registries.
      - name: Create manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          variants="$(find . -mindepth 1 -maxdepth 1 -type d -name 'digest-*' | sed -n 's|^\./digest-\([0-9.]*-[a-z]*\)-[a-z0-9]*$|\1|p' | sort -u)"
          [ -n "${variants}" ] || { echo "::error::No digests found"; exit 1; }
          for variant in ${variants}; do
            version="${variant%-*}"
            user="${variant##*-}"
            case "${user}" in
              root) images="flownative/composer2-root harbor.flownative.io/docker/composer2-root" ;;
              composer) images="flownative/composer2 harbor.flownative.io/docker/composer2" ;;
              *) echo "::error::Unexpected user '${user}'"; exit 1 ;;
            esac
            # Each artifact is a directory holding one empty file named
            # after the digest.
            digests="$(find . -mindepth 2 -path "./digest-${variant}-*/*" -type f -exec basename {} \;)"
            count="$(echo "${digests}" | wc -w | tr -d ' ')"
            if [ "${count}" -ne 2 ]; then
              echo "::error::PHP ${version}, user ${user}: expected 2 digests, found ${count}"
              exit 1
            fi
            for image in ${images}; do
              sources=()
              for digest in ${digests}; do
                sources+=("${image}@sha256:${digest}")
              done
              echo "::group::${image}:${version}"
              docker buildx imagetools create \
                --tag "${image}:${version%.*}" \
                --tag "${image}:${version}" \
                "${sources[@]}"
              docker buildx imagetools inspect "${image}:${version}"
              echo "::endgroup::"
            done
          done
